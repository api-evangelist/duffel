aid: duffel
url: https://raw.githubusercontent.com/api-evangelist/duffel/refs/heads/main/apis.yml
name: Duffel
kind: company
description: Duffel provides a single REST API for selling travel - flights from 300+
  airlines, 2M+ hotel properties (Stays), loyalty programmes, and merchant-of-record
  payments. The Duffel API exposes offer requests, offers, orders, seat maps, order
  changes and cancellations, payments, and Stays search-to-booking, with webhooks
  for asynchronous events.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
