  - url: https://duffel.com/docs/api/v2/offer-requests
    type: APIReference
  - url: openapi/duffel-openapi.yml
    type: OpenAPI
  description: Create an offer request describing the journey, passengers, and cabin
    class to initiate a flight search; airlines return matching offers. Supports listing
    and retrieving offer requests.
