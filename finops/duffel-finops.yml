meters:
- name: confirmed_orders
  description: Confirmed flight orders, billed per order ($3.00) each month.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - mode
- name: paid_ancillaries
  description: Paid ancillaries (bags, seats, etc.) added to orders, billed per ancillary ($2.00).
  unit: ancillaries
  aggregation: sum
  dimensions:
  - account
  - order
- name: managed_content_value
  description: Order value subject to the managed content fee (1% of total order value).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - order
- name: excess_searches
  description: Searches beyond the 1500:1 search-to-book ratio, billed at $0.005 per search.
  unit: searches
  aggregation: sum
  dimensions:
  - account
- name: fx_converted_amount
  description: Amount converted between currencies, charged a 2% FX margin.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - currency
- name: stays_commission
  description: Profit-share commission earned (negative cost) on completed Stays bookings.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - accommodation
principles:
- name: Visibility
  description: Pull Duffel order, ancillary, and search-volume reporting; track per-order and per-ancillary fees.
- name: Allocation
  description: Tag orders by brand/channel/team; map confirmed-order and ancillary fees to cost centers.
- name: Optimization
  description: Improve the search-to-book ratio to stay within the included 1500:1 band; minimize unnecessary FX conversions; lean on Stays commission to offset flight fees.
- name: Accountability
  description: Assign owners per channel; review confirmed-order, ancillary, managed-content, FX, and excess-search fees monthly against budget.
maintainers:
