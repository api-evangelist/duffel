description: >-
  FinOps view of Duffel spend. Duffel bills a pay-as-you-go, per-booking model:
  a per-confirmed-order fee for flights, a per-paid-ancillary fee, a percentage
  of order value for managed content, an FX margin on currency conversions, and
  an excess search fee once the 1500:1 search-to-book ratio is exceeded. Stays
  is monetized through a commission / profit-share on completed bookings rather
  than a usage fee. Enterprise agreements carry custom pricing.
notes: >-
  Per-fee rates are subject to change and may vary by agreement; verify against
  the Duffel pricing page during reconciliation.
sources:
- https://duffel.com/pricing
- https://duffel.com/docs
- https://focus.finops.org/focus-specification/v1-3/
