publisherName: Duffel
serviceCategory: Travel and Booking
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Duffel API
  ServiceCategory: Travel and Booking
  ProviderName: Duffel
  PublisherName: Duffel
  InvoiceIssuerName: Duffel
